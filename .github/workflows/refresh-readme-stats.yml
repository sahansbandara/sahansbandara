name: Refresh README Stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Download validated stats snapshots
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          dark_url='https://github-readme-stats-sigma-five.vercel.app/api?username=sahansbandara&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=8B5CF6&icon_color=06B6D4&text_color=E0E7FF'
          light_url='https://github-readme-stats-sigma-five.vercel.app/api?username=sahansbandara&show_icons=true&count_private=true&include_all_commits=true&hide_rank=true&hide_border=true&bg_color=FFFFFF&title_color=7C3AED&icon_color=0891B2&text_color=0F172A'

          curl --fail --location --retry 3 --retry-all-errors \
            --output "$temp_dir/github-overview-dark.svg" "$dark_url"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$temp_dir/github-overview-light.svg" "$light_url"

          grep --quiet '<svg' "$temp_dir/github-overview-dark.svg"
          grep --quiet '<svg' "$temp_dir/github-overview-light.svg"

          mkdir -p assets/generated
          install -m 0644 "$temp_dir/github-overview-dark.svg" assets/generated/github-overview-dark.svg
          install -m 0644 "$temp_dir/github-overview-light.svg" assets/generated/github-overview-light.svg

      - name: Commit changed snapshots
        shell: bash
        run: |
          if git diff --quiet -- assets/generated; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "chore: refresh README stats"
          git push
