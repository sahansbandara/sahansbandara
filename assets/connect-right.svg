<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-labelledby="title">
  <title id="title">Open to Collaboration</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M260 12h-61l-13 13h-47l-12 12H0" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M242 45h-52l-10-10h-34" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-width="1.2"/>
  <circle r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M260 12h-61l-13 13h-47l-12 12H0" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="45" r="2.5" fill="#8b5cf6">
    <animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <rect x="2" y="5" width="132" height="23" rx="11.5" fill="#0b1222" stroke="#334155"/>
  <text x="68" y="21" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.1">OPEN TO COLLAB</text>
</svg>
