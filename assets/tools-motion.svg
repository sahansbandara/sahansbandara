<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="48" viewBox="0 0 1180 48" role="img" aria-labelledby="title">
  <title id="title">Toolchain Ready</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#06b6d4"/>
      <stop offset=".75" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="48" fill="#0d1117"/>
  <path d="M0 24h170l15-12h95l18 12h210M1180 24h-170l-15-12h-95l-18 12H672" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <circle cx="332" cy="24" r="5" fill="none" stroke="#22d3ee" stroke-width="2">
      <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="848" cy="24" r="5" fill="none" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="r" values="3;7;3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="508" y="9" width="164" height="30" rx="15" fill="#0b1222" stroke="url(#accent)"/>
  <circle cx="529" cy="24" r="4" fill="#10b981" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="598" y="28" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5">TOOLCHAIN READY</text>
</svg>
