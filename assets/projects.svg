<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Featured Projects</title>
  <desc id="desc">Four clickable project cards with descriptions, technology tags, and primary languages.</desc>
  <defs>
    <linearGradient id="accent"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:#0d1117}.panel{fill:#0c1426;stroke:#164e63}.bar{fill:#0b1222}.primary{fill:#f8fafc}.secondary{fill:#a5b4cf}.muted{fill:#64748b}.repo{fill:#94a3b8}.tagbox{fill:#2e1b59;stroke:#6d4baa}.tag{fill:#c4b5fd}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
