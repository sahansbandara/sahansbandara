  <rect class="bg" width="1180" height="420" rx="10"/>
  <text class="mono" x="24" y="28" font-size="12" letter-spacing="2" fill="#22d3ee">PROJECTS.LIST</text>
  <text class="mono muted" x="158" y="28" font-size="10">./projects.sh --featured</text>
  <line x1="24" y1="42" x2="1156" y2="42" stroke="url(#accent)" opacity=".7"/>
