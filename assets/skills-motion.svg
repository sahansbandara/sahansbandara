<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="48" viewBox="0 0 1180 48" role="img" aria-labelledby="title">
  <title id="title">Skill Matrix</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset=".25" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset=".75" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="48" fill="#0d1117"/>
  <path d="M0 24h250l18-13h110l20 13h116M1180 24H930l-18-13H802l-20 13H666" fill="none" stroke="url(#accent)" stroke-width="1.5"/>

  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="115" cy="24" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="11" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="398" cy="24" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#a78bfa" filter="url(#glow)">
    <circle cx="1065" cy="24" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".25s" repeatCount="indefinite"/></circle>
    <circle cx="912" cy="11" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".75s" repeatCount="indefinite"/></circle>
    <circle cx="782" cy="24" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin="1.25s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="514" y="9" width="152" height="30" rx="15" fill="#0b1222" stroke="url(#accent)"/>
  <text x="590" y="28" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.8">SKILL MATRIX</text>
</svg>
