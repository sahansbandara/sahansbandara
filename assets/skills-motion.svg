<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="48" viewBox="0 0 1180 48" role="img" aria-labelledby="title">
  <title id="title">Skill Matrix</title>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".05"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-150%" width="300%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1180" height="48" fill="#0d1117"/>
  <path d="M0 24h250l18-13h176l22 13h34" fill="none" stroke="url(#left)" stroke-width="1.5"/>
  <path d="M1180 24H930l-18-13H736l-22 13h-34" fill="none" stroke="url(#right)" stroke-width="1.5"/>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M0 24h250l18-13h176l22 13h34" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M1180 24H930l-18-13H736l-22 13h-34" dur="4.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <rect x="500" y="8" width="180" height="32" rx="16" fill="#0b1222" stroke="url(#pill)"/>
  <circle cx="523" cy="24" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="602" y="28" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.7">SKILL MATRIX</text>
</svg>
