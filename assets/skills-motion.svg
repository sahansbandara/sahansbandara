<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="60" viewBox="0 0 1180 60" role="img" aria-labelledby="title">
  <title id="title">Skill Matrix</title>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".05"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-150%" width="300%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1180" height="60" fill="#0d1117"/>
  <rect x="465" y="9" width="250" height="42" rx="21" fill="#0b1222" stroke="url(#pill)" stroke-width="1.5"/>
  <circle cx="495" cy="30" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <text x="603" y="35" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">SKILL MATRIX</text>
</svg>
