<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="48" viewBox="0 0 1180 48" role="img" aria-labelledby="title">
  <title id="title">Live GitHub Metrics</title>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1180" height="48" fill="#0d1117"/>
  <path d="M0 24h290l16-13h142l22 13h44" fill="none" stroke="url(#left)" stroke-width="1.5"/>
  <path d="M1180 24H890l-16-13H732l-22 13h-44" fill="none" stroke="url(#right)" stroke-width="1.5"/>

  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M0 24h290l16-13h142l22 13h44" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M1180 24H890l-16-13H732l-22 13h-44" dur="4.6s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

  <rect x="514" y="9" width="152" height="30" rx="15" fill="#0b1222" stroke="url(#pill)"/>
  <circle cx="534" cy="24" r="4" fill="#10b981" filter="url(#glow)">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="602" y="28" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.5">LIVE METRICS</text>
</svg>
