<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="22" viewBox="0 0 1180 22" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".08"/>
      <stop offset=".25" stop-color="#06b6d4" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#6366f1" stop-opacity=".7"/>
      <stop offset=".75" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="22" fill="#0d1117"/>
  <line x1="18" y1="11" x2="1162" y2="11" stroke="#334155" stroke-opacity=".65"/>
  <line x1="18" y1="11" x2="1162" y2="11" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="150 994" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="150;-1144" dur="5.5s" repeatCount="indefinite"/>
  </line>
</svg>
