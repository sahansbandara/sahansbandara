<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-labelledby="title">
  <title id="title">Let's Connect</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M0 12h61l13 13h47l12 12h127" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <path d="M18 45h52l10-10h34" fill="none" stroke="#06b6d4" stroke-opacity=".35" stroke-width="1.2"/>
  <circle r="3.5" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M0 12h61l13 13h47l12 12h127" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="45" r="2.5" fill="#06b6d4">
    <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="130" y="5" width="122" height="23" rx="11.5" fill="#0b1222" stroke="#334155"/>
  <text x="191" y="21" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.4">LET'S CONNECT</text>
</svg>
