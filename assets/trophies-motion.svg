<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="48" viewBox="0 0 1180 48" role="img" aria-labelledby="title">
  <title id="title">Achievements Unlocked</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="48" fill="#0d1117"/>
  <line x1="0" y1="24" x2="490" y2="24" stroke="url(#accent)" stroke-width="1.5"/>
  <line x1="690" y1="24" x2="1180" y2="24" stroke="url(#accent)" stroke-width="1.5"/>

  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M0 24H490" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M1180 24H690" dur="4.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <rect x="490" y="8" width="200" height="32" rx="16" fill="#0b1222" stroke="#4f46e5"/>
  <path d="M516 16l2.2 4.6 5.1.7-3.7 3.6.9 5.1-4.5-2.4-4.5 2.4.9-5.1-3.7-3.6 5.1-.7z" fill="#22d3ee" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" values="0 516 24;360 516 24" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="604" y="28" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.3">ACHIEVEMENTS UNLOCKED</text>
</svg>
