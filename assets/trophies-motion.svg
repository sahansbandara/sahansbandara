<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="60" viewBox="0 0 1180 60" role="img" aria-labelledby="title">
  <title id="title">Achievements Unlocked</title>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".05"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-150%" width="300%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1180" height="60" fill="#0d1117"/>
  <path d="M18 30H465" fill="none" stroke="url(#left)" stroke-width="2"/>
  <path d="M715 30H1162" fill="none" stroke="url(#right)" stroke-width="2"/>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M18 30H465" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M1162 30H715" dur="4.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <rect x="465" y="9" width="250" height="42" rx="21" fill="#0b1222" stroke="url(#pill)" stroke-width="1.5"/>
  <circle cx="495" cy="30" r="5" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="603" y="34" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.2">ACHIEVEMENTS UNLOCKED</text>
</svg>
